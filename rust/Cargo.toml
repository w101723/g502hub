[package]
name = "g502hub"
version = "0.1.0"
edition = "2021"

[dependencies]
hidapi = { version = "2.6", features = ["macos-shared-device"] }
tray-icon = "0.19"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSPanel",
    "NSWindow",
    "NSGraphics",
    "NSVisualEffectView",
    "NSStackView",
    "NSSlider",
    "NSSliderCell",
    "NSButton",
    "NSButtonCell",
    "NSSegmentedControl",
    "NSSegmentedCell",
    "NSBox",
    "NSFont",
    "NSTextField",
    "NSTextFieldCell",
    "NSText",
    "NSColor",
    "NSEvent",
    "NSGraphicsContext",
    "NSAnimationContext",
    "NSLayoutConstraint",
    "NSLayoutAnchor",
    "NSView",
    "NSControl",
    "NSUserInterfaceLayout",
    "NSScreen",
    "NSScrollView",
    "NSBezierPath",
    "NSTrackingArea",
    "NSCursor",
    "NSResponder",
    "NSAttributedString",
    "NSStringDrawing",
    "NSImage",
    "NSFontDescriptor",
    "NSAppearance",
    "NSPasteboard",
] }
objc2-foundation = { version = "0.2", features = ["NSRunLoop", "NSNotification", "NSGeometry", "NSValue", "NSArray", "NSString", "NSDictionary", "NSData"] }
core-graphics = "0.24"
core-foundation = "0.10"
core-foundation-sys = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
strip = true
lto = true
