[package]
name = "g502hub"
version = "0.1.0"
edition = "2021"

[dependencies]
hidapi = { version = "2.6", features = ["macos-shared-device"] }
tray-icon = "0.19"
objc2 = "0.5"
objc2-app-kit = "0.2"
objc2-foundation = "0.2"
core-graphics = "0.24"
core-foundation = "0.10"
core-foundation-sys = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
strip = true
lto = true
